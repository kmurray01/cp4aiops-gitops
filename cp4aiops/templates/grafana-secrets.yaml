{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-k8s-proxy
  namespace: {{ .Values.monitoringNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "130"
type: Opaque
stringData:
  session_secret: {{ randAlphaNum 64 | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-cluster-monitoring
  namespace: {{ .Values.monitoringNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "130"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-auth-secret
  namespace: {{ .Values.monitoringNamespace }}
  annotations:
    kubernetes.io/service-account.name: grafana-cluster-monitoring
    argocd.argoproj.io/sync-wave: "130"
type: kubernetes.io/service-account-token
{{- end }}