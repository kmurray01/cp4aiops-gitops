{{- if .Values.monitoring.enabled }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: {{ .Values.monitoring.grafana.namespace }}
  labels:
    dashboards: "grafana"
  annotations:
    argocd.argoproj.io/sync-wave: "140"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  client:
    preferIngress: false
  config:
    auth:
      disable_login_form: "false"
      disable_signout_menu: "true"
    auth.anonymous:
      enabled: "true"
      org_role: Admin
    auth.basic:
      enabled: "true"
    log:
      level: warn
      mode: console
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana-proxy
              image: {{ .Values.monitoring.grafana.oauth.image }}
              imagePullPolicy: Always
              args:
                - -provider=openshift
                - -pass-basic-auth=false
                - -https-address=:9091
                - -http-address=
                - -email-domain=*
                - -upstream=http://localhost:3000
                - $(SAR)
                - '-openshift-delegate-urls={"/": {"resource": "namespaces", "verb": "get"}}'
                - -tls-cert=/etc/tls/private/tls.crt
                - -tls-key=/etc/tls/private/tls.key
                - -client-secret-file=/var/run/secrets/kubernetes.io/serviceaccount/token
                - -cookie-secret-file=/etc/proxy/secrets/session_secret
                - -openshift-service-account=grafana-sa
                - -openshift-ca=/etc/pki/tls/cert.pem
                - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                - -skip-auth-regex=^/metrics
              env:
                - name: SAR
                  value: '-openshift-sar={"resource": "namespaces", "verb": "get"}'
              ports:
                - containerPort: 9091
                  name: grafana-proxy
                  protocol: TCP
              resources: {}
              volumeMounts:
                - mountPath: /etc/tls/private
                  name: secret-grafana-k8s-tls
                  readOnly: false
                - mountPath: /etc/proxy/secrets
                  name: secret-grafana-k8s-proxy
                  readOnly: false
          volumes:
            - name: secret-grafana-k8s-tls
              secret:
                secretName: grafana-k8s-tls
            - name: secret-grafana-k8s-proxy
              secret:
                secretName: grafana-k8s-proxy
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      {{- if .Values.monitoring.grafana.storage.storageClass }}
      storageClassName: {{ .Values.monitoring.grafana.storage.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.monitoring.grafana.storage.size }}
  route:
    spec:
      port:
        targetPort: grafana-proxy
      tls:
        termination: reencrypt
      to:
        kind: Service
        name: grafana-service
        weight: 100
      wildcardPolicy: None
  service:
    metadata:
      annotations:
        service.alpha.openshift.io/serving-cert-secret-name: grafana-k8s-tls
    spec:
      ports:
        - name: grafana-proxy
          port: 9091
          protocol: TCP
          targetPort: grafana-proxy
  serviceAccount:
    metadata:
      annotations:
        serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"grafana-route"}}'
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: {{ .Values.monitoring.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "150"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  datasource:
    access: proxy
    isDefault: true
    jsonData:
      httpHeaderName1: 'Authorization'
      timeInterval: 5s
      tlsSkipVerify: true
    name: prometheus
    secureJsonData:
      httpHeaderValue1: 'Bearer ${token}'
    type: prometheus
    url: {{ .Values.monitoring.grafana.prometheus.url | quote }}
  instanceSelector:
    matchLabels:
      dashboards: grafana
  valuesFrom:
    - targetPath: secureJsonData.httpHeaderValue1
      valueFrom:
        secretKeyRef:
          key: token
          name: grafana-auth-secret
{{- end }}