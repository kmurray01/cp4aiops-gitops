apiVersion: batch/v1
kind: Job
metadata:
  name: idp-ibm-verify-setup
  namespace: {{.Values.namespace}}
  annotations:
    argocd.argoproj.io/sync-wave: "130"
spec:
  template:
    spec:
      containers:
      - name: my-container
        image: registry.redhat.io/openshift4/ose-cli:latest
        command: ["/bin/bash", "/etc/config/idp-ibm-verify.sh", "-n", {{ .Values.namespace }}]
        volumeMounts:
        - name: script-volume
          mountPath: /etc/config
        env:
          - name: ADMIN_EMAIL
            valueFrom:
              configMapKeyRef:
                name: aiops-saas-config
                key: adminemail
      volumes:
        - name: script-volume
          configMap:
            name: idp-ibm-verify
            defaultMode: 0744
      restartPolicy: Never
      serviceAccountName: ibm-watson-aiops-ui-operator-manager-role
