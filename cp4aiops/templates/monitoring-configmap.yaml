{{- if .Values.monitoring.enabled}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "110"
data:
  config.yaml: |
    prometheus:
      resources:
        limits:
          cpu: 1
          memory: 5Gi
        requests:
          cpu: 200m
          memory: 2Gi
      retention: 15d
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi
          storageClassName: {{ .Values.installation.spec.storageClass }}
{{- end }}
