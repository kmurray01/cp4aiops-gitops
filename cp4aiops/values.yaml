namespace: cp4aiops

gitops:
  namespaceScoped: false

catalog:
  name: ibm-aiops-catalog
  image: icr.io/cpopen/ibm-aiops-catalog@sha256:498bf235db6321fe46b3b98528f50dcbc64f7d5a991f2d9ed072993740b166e7

subscription:
  name: ibm-aiops-orchestrator
  channel: v4.13

installation:
  name: ibm-cp-aiops
  spec:
    monitoring:
      enabled: true
    size: large
    storageClass: ocs-storagecluster-cephfs
    storageClassLargeBlock: ocs-storagecluster-ceph-rbd
    topologyModel: application
    license:
      accept: ''
    pakModules:
    - name: aiopsFoundation
      enabled: true
    - name: applicationManager
      enabled: true
    - name: aiManager
      enabled: true
    - name: connection
      enabled: false
    - name: logAnomalyDetection
      enabled: false

monitoring:
  enabled: true
  grafana:
    namespace: monitoring-grafana
    subscription:
      name: monitoring-grafana
      channel: v5
      source: community-operators
      sourceNamespace: openshift-marketplace
    storage:
      size: 2Gi
      storageClass: ""  # Uses default storage class if empty
    oauth:
      image: registry.redhat.io/openshift4/ose-oauth-proxy:v4.14
    prometheus:
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091

instana:
  namespace: instana-agent
  subName: instana-agent-operator
  catalogSource: certified-operators
  catalogSourceNamespace: openshift-marketplace
  channel: stable
